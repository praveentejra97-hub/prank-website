<!DOCTYPE html>
<html>
<head>
<title>System Alert</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
background:black;
color:#00ff00;
font-family:monospace;
overflow:hidden;
}

.center{
text-align:center;
margin-top:120px;
}

button{
padding:15px 30px;
font-size:20px;
background:red;
color:white;
border:none;
border-radius:8px;
}

#terminal{
padding:20px;
font-size:18px;
white-space:pre-line;
}

.progress{
width:80%;
height:25px;
border:2px solid lime;
margin:20px;
}

.bar{
height:100%;
width:0%;
background:lime;
}

.popup{
position:fixed;
top:25%;
left:25%;
width:50%;
background:#111;
border:3px solid red;
padding:20px;
display:none;
text-align:center;
color:white;
font-size:22px;
}

.glitch{
animation:shake 0.1s infinite;
}

@keyframes shake{
0%{transform:translate(4px,4px);}
25%{transform:translate(-4px,4px);}
50%{transform:translate(4px,-4px);}
75%{transform:translate(-4px,-4px);}
100%{transform:translate(4px,4px);}
}

.red{
color:red;
font-size:32px;
text-align:center;
margin-top:100px;
}
</style>
</head>

<body>

<div class="center" id="start">
<h1>⚠ Device Security Verification</h1>
<button onclick="startPrank()">Start Scan</button>
</div>

<div id="terminal"></div>

<div class="progress" id="prog" style="display:none">
<div class="bar" id="bar"></div>
</div>

<div class="popup" id="popup">⚠ CRITICAL VIRUS DETECTED ⚠</div>

<audio id="alarm">
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3">
</audio>

<script>

function vibratePattern(){
if(navigator.vibrate){
navigator.vibrate([300,100,300,100,600])
}
}

function startPrank(){

document.body.requestFullscreen()

vibratePattern()

document.getElementById("start").style.display="none"
document.getElementById("prog").style.display="block"

let term=document.getElementById("terminal")

let lines=[
"Connecting to Encrypted Server...",
"Scanning Storage...",
"Extracting Contacts...",
"Uploading Gallery...",
"Injecting Spyware...",
"Granting Remote Access...",
"Activating Tracking Mode...",
"Encrypting Device Files..."
]

let i=0

let typing=setInterval(()=>{
if(i<lines.length){
term.innerHTML+="> "+lines[i]+"\n"
document.body.classList.add("glitch")
vibratePattern()
i++
setTimeout(()=>{document.body.classList.remove("glitch")},300)
}
},1500)

let bar=document.getElementById("bar")
let width=0

let load=setInterval(()=>{
if(width>=100){
clearInterval(load)
clearInterval(typing)

document.getElementById("popup").style.display="block"
document.getElementById("alarm").play()
vibratePattern()

let count=5
let timer=setInterval(()=>{
term.innerHTML+="\nSYSTEM LOCK IN "+count
count--

if(count<0){
clearInterval(timer)
document.body.innerHTML="<h1 class='red'>😂 GOT YOU 😂<br>PRANK COMPLETE</h1>"
}
},1000)

}else{
width++
bar.style.width=width+"%"
}
},120)

}

</script>

</body>
</html>
