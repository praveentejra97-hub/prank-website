<!DOCTYPE html>
<html>
<head>
<title>Library Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
}

.container{
padding:20px;
}

input,button{
padding:10px;
margin:5px;
}

button{
background:#2c3e50;
color:white;
border:none;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
background:white;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

#dashboard{
display:none;
}

.logout{
float:right;
background:red;
}

.loginBox{
width:300px;
margin:120px auto;
background:white;
padding:20px;
text-align:center;
box-shadow:0 0 10px gray;
}
</style>
</head>

<body>

<header>
Library Management System
<button class="logout" onclick="logout()">Logout</button>
</header>

<div id="loginPage" class="loginBox">
<h2>Login</h2>
<input type="text" id="user" placeholder="Username"><br>
<input type="password" id="pass" placeholder="Password"><br>
<button onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
</div>

<div id="dashboard" class="container">

<h2>Add Book</h2>
<input type="text" id="bookName" placeholder="Book Name">
<button onclick="addBook()">Add</button>

<h2>Book List</h2>
<table id="table">
<tr>
<th>ID</th>
<th>Name</th>
<th>Status</th>
<th>Action</th>
</tr>
</table>

</div>

<script>

let id=1

function login(){
let u=document.getElementById("user").value
let p=document.getElementById("pass").value

if(u=="admin" && p=="1234"){
document.getElementById("loginPage").style.display="none"
document.getElementById("dashboard").style.display="block"
}else{
document.getElementById("msg").innerHTML="Wrong Login"
}
}

function logout(){
location.reload()
}

function addBook(){
let name=document.getElementById("bookName").value

if(name=="") return

let table=document.getElementById("table")

let row=table.insertRow()

row.insertCell(0).innerHTML=id++
row.insertCell(1).innerHTML=name
row.insertCell(2).innerHTML="Available"
row.insertCell(3).innerHTML=
"<button onclick='issue(this)'>Issue</button> <button onclick='removeBook(this)'>Delete</button>"

}

function issue(btn){
let row=btn.parentNode.parentNode
row.cells[2].innerHTML="Issued"
}

function removeBook(btn){
btn.parentNode.parentNode.remove()
}

</script>

</body>
</html>
