<!DOCTYPE html>
<html>
<head>
<title>Loading...</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    overflow:hidden;
}

#msg{
    margin-top:150px;
    font-size:28px;
}

#scare{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
}

#scare img{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>

<body>

<div id="msg">Loading Dark Web Access...</div>

<div id="scare">
<img src="https://i.imgur.com/ZQZSWrt.jpg">
</div>

<audio id="sound">
<source src="https://www.soundjay.com/human/scream-01.mp3">
</audio>

<script>

setTimeout(()=>{
    document.getElementById("msg").innerHTML="Accessing Private Files..."
},2000)

setTimeout(()=>{
    document.getElementById("msg").innerHTML="WARNING !!!"
},4000)

setTimeout(()=>{
    document.getElementById("scare").style.display="block"
    document.getElementById("sound").play()
    document.body.style.background="white"
},6000)

setTimeout(()=>{
    document.getElementById("scare").style.display="none"
    document.body.style.background="black"
    document.body.innerHTML="<h1 style='color:red;margin-top:200px'>😂 PRANK HO GAYA 😂</h1>"
},9000)

</script>

</body>
</html>
