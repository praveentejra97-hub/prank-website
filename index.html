<!DOCTYPE html>
<html>
<head>
<title>Security Breach</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    background:black;
    color:#00ff00;
    font-family:monospace;
    overflow:hidden;
}

#start{
    text-align:center;
    margin-top:120px;
}

button{
    padding:15px 30px;
    font-size:20px;
    background:red;
    color:white;
    border:none;
    border-radius:8px;
}

#terminal{
    padding:20px;
    font-size:18px;
    white-space:pre-line;
}

.progress{
    width:80%;
    height:25px;
    border:2px solid lime;
    margin:20px;
}

.bar{
    height:100%;
    width:0%;
    background:lime;
}

.glitch{
    animation:shake 0.15s infinite;
}

@keyframes shake{
    0%{transform:translate(2px,2px);}
    25%{transform:translate(-2px,2px);}
    50%{transform:translate(2px,-2px);}
    75%{transform:translate(-2px,-2px);}
    100%{transform:translate(2px,2px);}
}

.red{
    color:red;
    font-size:28px;
    text-align:center;
    margin-top:50px;
}
</style>
</head>

<body>

<div id="start">
<h1>⚠ Device Security Check Required</h1>
<button onclick="startHack()">Start Scan</button>
</div>

<div id="terminal"></div>

<div class="progress" id="prog" style="display:none">
<div class="bar" id="bar"></div>
</div>

<audio id="beep">
<source src="https://www.soundjay.com/button/beep-07.wav">
</audio>

<script>

function startHack(){

document.body.requestFullscreen()

document.getElementById("start").style.display="none"
document.getElementById("prog").style.display="block"

let term = document.getElementById("terminal")

let lines = [
"Initializing Secure Connection...",
"Scanning Device Storage...",
"Contacts Data Extracted...",
"Camera Access Granted...",
"Uploading Files To Remote Server...",
"Installing Tracking Malware...",
"Encrypting Device..."
]

let i = 0

let typing = setInterval(()=>{
    if(i < lines.length){
        term.innerHTML += "> " + lines[i] + "\n"
        document.getElementById("beep").play()
        document.body.classList.add("glitch")
        setTimeout(()=>{document.body.classList.remove("glitch")},300)
        i++
    }
},1500)

let bar = document.getElementById("bar")
let width = 0

let load = setInterval(()=>{
    if(width >= 100){
        clearInterval(load)
        clearInterval(typing)

        let count = 5
        let timer = setInterval(()=>{
            term.innerHTML += "\nDEVICE LOCK IN " + count
            count--

            if(count < 0){
                clearInterval(timer)
                term.innerHTML += "\n\n😂 PRANK HO GAYA 😂"
                term.className="red"
            }
        },1000)

    }else{
        width++
        bar.style.width = width + "%"
    }
},120)

}

</script>

</body>
</html>
